<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diario técnico</title>
  <meta name="theme-color" content="#0891b2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Diario técnico">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Aplica el tema guardado ANTES de pintar, para que no parpadee -->
  <script>
    try { var t = localStorage.getItem('dt-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Menú principal"></aside>
    <div id="scrim"></div>
    <header id="topbar"></header>
    <main id="view"></main>
    <nav id="tabbar" aria-label="Navegación"></nav>
  </div>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
